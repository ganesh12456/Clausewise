name: Verify Clausewise
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: clausewise
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: clausewise_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
        env:
          TEST_DATABASE_URL: postgresql://clausewise:ci-only-password@localhost:5432/clausewise_test
      - run: npm run typecheck
      - run: npm run build:appsail
      - uses: actions/upload-artifact@v4
        with:
          name: clausewise-appsail-build
          path: dist/clausewise-appsail.zip
          if-no-files-found: error
          retention-days: 14
