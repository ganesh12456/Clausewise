name: Verify Clausewise
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run build:appsail
      - uses: actions/upload-artifact@v4
        with:
          name: clausewise-appsail-build
          path: dist/clausewise-appsail.zip
          if-no-files-found: error
          retention-days: 14
