name: clausewise-local
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: clausewise
      POSTGRES_DB: clausewise
      POSTGRES_PASSWORD: ${LOCAL_POSTGRES_PASSWORD:?Run npm run local:setup first}
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clausewise -d clausewise"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped
volumes:
  postgres-data:
